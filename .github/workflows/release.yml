name: Release

on:
  push:
    branches: [main]

concurrency:
  group: main-ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    # Was `self-hosted`. Swapped to GitHub-hosted runners for now because the self-hosted runners
    # are offline (owner decision, #161). This job shares the `main-ci-<ref>` concurrency group with
    # Build & Deploy, so a Release run queued on an offline runner held every deploy behind it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/install

      - name: Build publishable package
        run: pnpm --filter ./packages/cli build

      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
