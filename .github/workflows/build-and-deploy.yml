name: Build & Deploy

on:
  push:
    branches: [main]
    # Generated from scripts/deploy-trigger-paths.ts (buildAndDeployWorkflowPushPaths); keep them
    # identical. scripts/build-and-deploy-workflow.test.ts fails when they drift.
    paths:
      - 'apps/browserextensions.io/**'
      - 'sites/browserextensions.io/**'
      - 'apps/serp.ai/**'
      - 'sites/serp.ai/**'
      - 'apps/serpdownloaders.com/**'
      - 'sites/serpdownloaders.com/**'
      - '.github/actions/install/**'
      - 'packages/**'
      - 'configs/**'
      - 'scripts/**'
      - 'sites/*'
      - 'sites/default/**'
      - '.nvmrc'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '!**/*.test.ts'
      - '!**/*.test.tsx'
      - '!**/__tests__/**'
      - '!**/*.md'
      - '!packages/cli/**'
      - '!packages/generator/**'
      - '!packages/validators/**'
      - '!scripts/deploy-to-repo.sh'
      - '!scripts/featured-badge-approved-r2-assets.json'
      - '!scripts/generate-badges.ts'
      - '!scripts/import-downloaders-from-sheet.ts'
      - '!scripts/listing-rewrite-excluded.txt'
      - '!scripts/listing-rewrite-fact-overrides.json'
      - '!scripts/listing-rewrite-source-overrides.json'
      - '!scripts/listing-rewrite.ts'
      - '!scripts/r2-featured-badge-assets.json'
      - '!scripts/templates/target-verify-badge.yml'
      - '!scripts/test-submission-flow.ts'
      - '!scripts/upgrade-downloader-content.ts'
  workflow_dispatch:
    inputs:
      site_id:
        description: 'Checked-in site config id'
        required: true
        type: choice
        options:
          - all
          - browserextensions.io
          - serp.ai
          - serpdownloaders.com

concurrency:
  group: main-ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  resolve:
    name: Resolve Deploy Targets
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip static deploy]')
    # Was `self-hosted`. Swapped to GitHub-hosted runners for now because the self-hosted runners
    # are offline (owner decision, #161).
    runs-on: ubuntu-latest
    outputs:
      deploy_targets: ${{ steps.resolve.outputs.deploy_targets }}
      should_deploy: ${{ steps.resolve.outputs.should_deploy }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install

      - name: Resolve build input
        id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SITE_ID: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.site_id || '' }}
          NEXT_PUBLIC_SITE_ID: ''
        run: ./node_modules/.bin/tsx scripts/resolve-build-run.ts >> "$GITHUB_OUTPUT"

  deploy:
    name: Validate, Build & Deploy (${{ matrix.target.siteId }})
    needs: resolve
    if: needs.resolve.outputs.should_deploy == 'true'
    # Was `self-hosted`. Swapped to GitHub-hosted runners for now because the self-hosted runners
    # are offline (owner decision, #161).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.resolve.outputs.deploy_targets) }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install

      - name: Validate site data
        env:
          SITE_ID: ${{ matrix.target.siteId }}
        run: pnpm validate:site

      - name: Build static site
        env:
          SITE_ID: ${{ matrix.target.siteId }}
        run: pnpm build:site

      - name: Audit XML sitemaps
        env:
          SITE_ID: ${{ matrix.target.siteId }}
        run: pnpm audit:sitemaps -- --site "$SITE_ID"

      - name: Audit forbidden listing links
        env:
          SITE_ID: ${{ matrix.target.siteId }}
        run: pnpm audit:forbidden-links -- --site "$SITE_ID"

      - name: Verify deploy auth
        env:
          DEPLOY_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "Missing GH_PAT secret required for cross-repo deploy."
            exit 1
          fi

      - name: Deploy
        env:
          ALLOW_DEPLOY_TARGET_OVERRIDE: ''
          DEPLOY_TOKEN: ${{ secrets.GH_PAT }}
          DEPLOY_BRANCH: ''
          DEPLOY_REPO_URL: ''
          SITE_ID: ${{ matrix.target.siteId }}
        run: pnpm deploy:site
