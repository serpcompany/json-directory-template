name: Transfer GSC credentials to D1

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type transfer-gsc-credentials-to-directory-platform-d1'
        required: true
        type: string

permissions:
  contents: read

jobs:
  transfer:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'transfer-gsc-credentials-to-directory-platform-d1'
    runs-on: ubuntu-latest
    steps:
      - name: Transfer existing credentials without exposing values
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GSC_OAUTH_CLIENT_ID: ${{ secrets.GSC_OAUTH_CLIENT_ID }}
          GSC_OAUTH_CLIENT_SECRET: ${{ secrets.GSC_OAUTH_CLIENT_SECRET }}
          GSC_OAUTH_REFRESH_TOKEN: ${{ secrets.GSC_OAUTH_REFRESH_TOKEN }}
          GSC_QUOTA_PROJECT: ${{ secrets.GSC_QUOTA_PROJECT }}
          TARGET_REPOSITORY: serpcompany/directory-platform-d1
        run: |
          set -euo pipefail

          for name in \
            GSC_OAUTH_CLIENT_ID \
            GSC_OAUTH_CLIENT_SECRET \
            GSC_OAUTH_REFRESH_TOKEN \
            GSC_QUOTA_PROJECT
          do
            if [ -z "${!name:-}" ]; then
              echo "Missing source secret: $name" >&2
              exit 1
            fi
            printf '%s' "${!name}" | gh secret set "$name" --repo "$TARGET_REPOSITORY"
          done

      - name: Set canonical D1 Search Console property mappings
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TARGET_REPOSITORY: serpcompany/directory-platform-d1
        run: |
          gh variable set GSC_SITE_URL_MAP \
            --repo "$TARGET_REPOSITORY" \
            --body '{"pornvideodownloaders.com":"sc-domain:pornvideodownloaders.com","serp.software":"sc-domain:serp.software"}'

      - name: Verify destination authority by name only
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TARGET_REPOSITORY: serpcompany/directory-platform-d1
        run: |
          set -euo pipefail

          destination_secrets="$(
            gh secret list --repo "$TARGET_REPOSITORY" --json name --jq '.[].name'
          )"
          for name in \
            GSC_OAUTH_CLIENT_ID \
            GSC_OAUTH_CLIENT_SECRET \
            GSC_OAUTH_REFRESH_TOKEN \
            GSC_QUOTA_PROJECT
          do
            if ! grep -Fxq "$name" <<<"$destination_secrets"; then
              echo "Destination secret was not created: $name" >&2
              exit 1
            fi
          done

          test "$(
            gh variable get GSC_SITE_URL_MAP --repo "$TARGET_REPOSITORY"
          )" = '{"pornvideodownloaders.com":"sc-domain:pornvideodownloaders.com","serp.software":"sc-domain:serp.software"}'
